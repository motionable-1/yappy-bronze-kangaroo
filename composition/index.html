<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantum Pulse Promo</title>
  
  <!-- Premium Google Fonts pairing: Space Grotesk (Editorial Tech Heading), Inter (Clean UI/Body), JetBrains Mono (Technical Detail) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      color-scheme: dark;
      background: #03030b;
      font-kerning: normal;
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #03030b;
      font-family: 'Inter', sans-serif;
    }

    /* Stage bounds: exact 9:16 Portrait aspect ratio (1080x1920) */
    #stage {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #03030b;
    }

    /* Ambient Background System */
    .ambient-bg {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }

    .grid-overlay {
      position: absolute;
      inset: 0;
      opacity: 0.12;
      background-image: 
        linear-gradient(to right, rgb(255 255 255 / 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgb(255 255 255 / 0.08) 1px, transparent 1px);
      background-size: 80px 80px;
      mask-image: radial-gradient(circle at 50% 50%, black 30%, transparent 100%);
      pointer-events: none;
    }

    .noise-layer {
      position: absolute;
      inset: 0;
      opacity: 0.025;
      background-image: repeating-radial-gradient(#fff, #000 10%, #fff 20%);
      background-size: 3px 3px;
      mix-blend-mode: overlay;
      pointer-events: none;
    }

    /* Glowing Color Orbs */
    .glow-orb {
      position: absolute;
      border-radius: 999px;
      filter: blur(160px);
      opacity: 0.45;
      pointer-events: none;
      will-change: transform, opacity;
    }

    .orb-violet {
      top: -200px;
      left: 100px;
      width: 700px;
      height: 700px;
      background: #7209B7;
    }

    .orb-magenta {
      bottom: 200px;
      right: -200px;
      width: 800px;
      height: 800px;
      background: #F72585;
    }

    .orb-cyan {
      top: 700px;
      left: -300px;
      width: 800px;
      height: 800px;
      background: #4CC9F0;
    }

    .orb-blue {
      bottom: -300px;
      left: 200px;
      width: 700px;
      height: 700px;
      background: #3A0CA3;
    }

    /* FLUX-generated Abstract Pulse Backdrop Overlay */
    .quantum-bg-image {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      object-fit: cover;
      mix-blend-mode: screen;
      opacity: 0.15;
      filter: contrast(1.15) brightness(0.85);
      pointer-events: none;
      will-change: opacity, transform;
    }

    /* Global Scene Elements styling */
    .scene {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 100px 80px;
      pointer-events: none;
      z-index: 5;
    }

    /* SCENE 1: THE SPARK */
    .scene-1 {
      justify-content: space-between;
    }

    .spark-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spark-core {
      width: 20px;
      height: 20px;
      background: #ffffff;
      border-radius: 999px;
      box-shadow: 
        0 0 40px #4CC9F0,
        0 0 80px #F72585,
        0 0 120px #7209B7;
      position: relative;
      z-index: 3;
    }

    .spark-ring {
      position: absolute;
      width: 160px;
      height: 160px;
      border: 3px solid #4CC9F0;
      border-radius: 999px;
      opacity: 0;
      z-index: 2;
      box-shadow: 0 0 30px rgb(76 201 240 / 0.4);
    }

    .spark-ring-outer {
      position: absolute;
      width: 240px;
      height: 240px;
      border: 1px dashed #F72585;
      border-radius: 999px;
      opacity: 0;
      z-index: 1;
    }

    .scene-1 .text-block {
      position: absolute;
      bottom: 240px;
      width: 920px;
      text-align: center;
    }

    .scene-1 .title-wrap {
      overflow: hidden;
      margin-bottom: 15px;
    }

    .scene-1 h1.main-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 84px;
      font-weight: 800;
      color: #ffffff;
      margin: 0;
      letter-spacing: -0.02em;
      line-height: 1.1;
      text-transform: uppercase;
      text-shadow: 0 4px 24px rgb(0 0 0 / 0.6);
      text-wrap: balance;
    }

    .scene-1 .subtitle-wrap {
      overflow: hidden;
    }

    .scene-1 p.subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 36px;
      font-weight: 400;
      color: #8e95b0;
      margin: 0;
      letter-spacing: 0.04em;
      line-height: 1.4;
      text-shadow: 0 4px 12px rgb(0 0 0 / 0.4);
    }

    /* SCENE 2: THE RESONANCE */
    .scene-2 {
      justify-content: flex-start;
      padding-top: 180px;
    }

    .waves-container {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      z-index: -1;
    }

    .resonance-svg {
      width: 1080px;
      height: 1920px;
    }

    .wave-path {
      stroke-linecap: round;
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
    }

    .scene-2 .text-block {
      width: 920px;
      text-align: center;
      margin-bottom: 80px;
    }

    .scene-2 h2.main-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 72px;
      font-weight: 800;
      color: #ffffff;
      margin: 0;
      letter-spacing: -0.02em;
      line-height: 1.15;
      text-transform: uppercase;
      text-wrap: balance;
    }

    .scene-2 p.subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 28px;
      font-weight: 500;
      color: #4CC9F0;
      margin: 20px 0 0 0;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* Glassmorphic Metric Panel Card */
    .card-container {
      width: 920px;
      display: flex;
      justify-content: center;
    }

    .glass-card {
      width: 820px;
      background: linear-gradient(135deg, rgb(255 255 255 / 0.08) 0%, rgb(255 255 255 / 0.02) 100%);
      border: 1px solid rgb(255 255 255 / 0.12);
      border-radius: 40px;
      padding: 50px;
      box-shadow: 
        0 40px 100px rgb(0 0 0 / 0.6),
        inset 0 0 80px rgb(255 255 255 / 0.02);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      display: flex;
      flex-direction: column;
      gap: 35px;
      will-change: transform, opacity;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .card-icon {
      width: 50px;
      height: 50px;
      filter: drop-shadow(0 0 10px rgb(76 201 240 / 0.5));
    }

    .card-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      color: #8e95b0;
      letter-spacing: 0.15em;
    }

    .card-metric {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .metric-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 110px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .metric-unit {
      font-family: 'JetBrains Mono', monospace;
      font-size: 32px;
      font-weight: 500;
      color: #F72585;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-chart {
      width: 100%;
      height: 160px;
      background: rgb(255 255 255 / 0.02);
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgb(255 255 255 / 0.05);
      position: relative;
    }

    .mini-chart-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .chart-line-path {
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      filter: drop-shadow(0 4px 12px rgb(247 37 133 / 0.6));
    }

    /* SCENE 3: THE ECHO / OUTRO */
    .scene-3 {
      justify-content: space-between;
      padding-top: 240px;
      padding-bottom: 240px;
    }

    /* Interlocking Logo Rings Mesh */
    .logo-container {
      position: relative;
      width: 440px;
      height: 440px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .logo-mesh {
      position: relative;
      width: 360px;
      height: 360px;
      transform-style: preserve-3d;
      perspective: 800px;
    }

    .logo-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .logo-ring {
      fill: none;
      stroke-linecap: round;
      transform-origin: center;
    }

    .ring-outer-glow {
      position: absolute;
      inset: -30px;
      border-radius: 999px;
      background: radial-gradient(circle, rgb(76 201 240 / 0.2) 0%, transparent 70%);
      filter: blur(20px);
      z-index: -1;
    }

    .scene-3 .text-block {
      width: 920px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .scene-3 .tagline-top {
      font-family: 'JetBrains Mono', monospace;
      font-size: 24px;
      font-weight: 700;
      color: #F72585;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin: 0;
    }

    .scene-3 h1.final-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 96px;
      font-weight: 800;
      color: #ffffff;
      margin: 0;
      letter-spacing: -0.03em;
      line-height: 1.0;
      text-transform: uppercase;
      text-shadow: 0 8px 32px rgb(0 0 0 / 0.5);
    }

    .scene-3 h3.final-subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 32px;
      font-weight: 500;
      color: #8e95b0;
      margin: 10px 0 0 0;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    /* Modern CTA Interactive Glass Button */
    .cta-button-container {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    .cta-button {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 30px 64px;
      background: linear-gradient(135deg, #F72585 0%, #7209B7 100%);
      border: 1px solid rgb(255 255 255 / 0.2);
      border-radius: 999px;
      color: #ffffff;
      text-decoration: none;
      box-shadow: 
        0 20px 60px rgb(247 37 133 / 0.35),
        inset 0 1px 0 rgb(255 255 255 / 0.4);
      will-change: transform, box-shadow;
      position: relative;
      overflow: hidden;
    }

    .cta-button span {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .cta-button-shine {
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.25), transparent);
      transform: skewX(-30deg);
      pointer-events: none;
    }

    .cta-icon {
      width: 32px;
      height: 32px;
      filter: drop-shadow(0 0 5px #ffffff);
    }
  </style>
</head>
<body>

  <div
    id="stage"
    data-composition-id="Main"
    data-start="0"
    data-duration="14.0"
    data-width="1080"
    data-height="1920"
    data-motionabl-fps="30"
  >
    
    <!-- SYSTEM SOUNDTRACK & AUDIO CLIPS -->
    <!-- Ambient Tech Background Music -->
    <audio

    <!-- Voiceovers (Warm British George) -->
    <audio

    <audio

      preload="auto" 
      data-start="8.8" 
      data-duration="3.24" 
      data-track-index="2" 
      data-volume="1.0"
    ></audio>

    <!-- Synced Sound Effects (SFX) -->
    <!-- Scene 1: Sub bass drop with whoosh -->
    <audio 
      id="sfx-opener" 
      src="https://pub-e3bfc0083b0644b296a7080b21024c5f.r2.dev/sfx/1780428157688_vnlt1jcurzg_sfx_futuristic_cinematic_sub_bass_.mp3" 
      preload="auto"

      data-track-index="3" 
      data-volume="0.8"
    ></audio>
    <!-- Scene 2: High tech digital sweep synth whoosh -->
    <audio 
      id="sfx-sweep" 
      src="https://pub-e3bfc0083b0644b296a7080b21024c5f.r2.dev/sfx/1780428157798_76pv0cfuawl_sfx_high_tech_digital_sweep_synth_.mp3" 
      preload="auto" 
      data-start="3.8" 
      data-duration="4.0" 
      data-track-index="3" 
      data-volume="0.7"
    ></audio>
    <!-- Scene 3: Sleek glass chime synth click -->
    <audio 
      id="sfx-logo-chime" 
      src="https://pub-e3bfc0083b0644b296a7080b21024c5f.r2.dev/sfx/1780428160330_qzbn3hfs2ga_sfx_sleek_glass_chime_synth_click_.mp3" 
      preload="auto" 
      data-start="8.2" 
      data-duration="4.0" 
      data-track-index="3" 
      data-volume="0.9"
    ></audio>


    <!-- VISUAL MOMENTS & CLIP LAYERS -->
    
    <!-- PERSISTENT BACKGROUND LAYER (Track 0, full video duration) -->
    <div 
      class="clip ambient-bg" 
      data-start="0" 
      data-duration="14.0" 
      data-track-index="0"
    >
      <div class="grid-overlay"></div>
      <div class="noise-layer"></div>
      
      <!-- Glowing Animated Orbs -->
      <div class="glow-orb orb-violet"></div>
      <div class="glow-orb orb-magenta"></div>
      <div class="glow-orb orb-cyan"></div>
      <div class="glow-orb orb-blue"></div>
      
      <!-- FLUX-generated Abstract Pulse backdrop overlay (mix-blend-mode screen) -->
      <img 
        src="https://pub-e3bfc0083b0644b296a7080b21024c5f.r2.dev/generated-images/1780428168328_w6t2qrhhmla_image_breathtaking_cosmic_quantum_tech_ene.png" 
        class="quantum-bg-image" 
        alt="" 
      />
    </div>


    <!-- SCENE 1: THE SPARK (Track 4, 0.0s to 4.0s) -->
    <div 
      class="clip scene scene-1" 
      data-start="0" 
      data-duration="4.0" 
      data-track-index="4"
    >
      <!-- Middle core pulsing point -->
      <div class="spark-container">
        <div class="spark-core"></div>
        <div class="spark-ring"></div>
        <div class="spark-ring-outer"></div>

      <!-- Text details -->
      <div class="text-block">
        <div class="title-wrap">
          <h1 class="main-title split-chars">An Idea Sparks</h1>
        </div>
        <div class="subtitle-wrap">
          <p class="subtitle fade-in-up">It echoes in the dark.</p>
        </div>
      </div>
    </div>


    <!-- SCENE 2: THE RESONANCE (Track 5, 3.8s to 8.4s) -->
    <div 
      class="clip scene scene-2" 
      data-start="3.8" 
      data-duration="4.6" 
      data-track-index="5"
    >
      <!-- Abstract path traces drawing themselves -->
      <div class="waves-container">
        <svg class="resonance-svg" viewBox="0 0 1080 1920" fill="none">
          <!-- Wave 1 (Electric Magenta Gradient Path) -->
          <path 
            class="wave-path path-1" 
            d="M -100,1000 C 200,600 800,1500 1180,1100" 
            stroke="url(#grad-magenta)" 
            stroke-width="10" 
          />
          <!-- Wave 2 (Electric Cyan Gradient Path) -->
          <path 
            class="wave-path path-2" 
            d="M -100,1250 C 350,1550 700,850 1180,1150" 
            stroke="url(#grad-cyan)" 
            stroke-width="6" 
          />
          
          <defs>
            <linearGradient id="grad-magenta" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#F72585" stop-opacity="0" />
              <stop offset="35%" stop-color="#F72585" stop-opacity="0.8" />
              <stop offset="70%" stop-color="#7209B7" stop-opacity="1" />
              <stop offset="100%" stop-color="#3A0CA3" stop-opacity="0" />
            </linearGradient>
            <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#3A0CA3" stop-opacity="0" />
              <stop offset="30%" stop-color="#4361EE" stop-opacity="1" />
              <stop offset="65%" stop-color="#4CC9F0" stop-opacity="0.9" />
              <stop offset="100%" stop-color="#4CC9F0" stop-opacity="0" />
            </linearGradient>
          </defs>
        </svg>
      </div>

      <!-- Descriptive Typography block -->

        </div>
        <p class="subtitle">A sudden resonance is born</p>
      </div>

      <!-- Glassmorphic Dashboard Widget -->
      <div class="card-container">
        <div class="glass-card">
          <div class="card-header">
            <!-- Iconify solar wave icon -->
            <img 
              class="card-icon" 
              src="https://api.iconify.design/solar/pulse-bold-duotone.svg?color=%234CC9F0&width=48" 
              alt="" 
            />
            <span class="card-tag">SYSTEM RESONANCE</span>
          </div>
          <div class="card-metric">
            <span class="metric-value" id="counter-value">0.00</span>
            <span class="metric-unit">ms</span>

          <div class="card-chart">
            <svg class="mini-chart-svg" viewBox="0 0 720 160" fill="none">

                stroke-width="6"

            </svg>
          </div>
        </div>
      </div>
    </div>


    <!-- SCENE 3: THE OUTRO / VELOCITY (Track 6, 8.2s to 14.0s) -->
    <div 
      class="clip scene scene-3" 
      data-start="8.2" 
      data-duration="5.8" 
      data-track-index="6"
    >
      <!-- Complex Interlocking Neon Ring Logo -->
      <div class="logo-container">
        <div class="ring-outer-glow"></div>
        <div class="logo-mesh">
          <svg class="logo-svg" viewBox="0 0 400 400">

              class="logo-ring ring-cyan"

              cy="200"

              stroke="#4CC9F0"

            <!-- Rotating Magenta Inner Ring -->

              class="logo-ring ring-magenta" 
              cx="200"

              r="100"

              stroke-width="6" 
              stroke-dasharray="628" 
              stroke-dashoffset="628" 
            />

            <!-- Central core pulse node -->

      <!-- Outro Typography -->
      <div class="text-block">
        <span class="tagline-top">QUANTUM PRO</span>
        <h1 class="final-title split-chars">Quantum Pulse</h1>
        <h3 class="final-subtitle">Ignite the Infinite</h3>
      </div>

      <!-- Interactive mock glass CTA Button -->
      <div class="cta-button-container">
        <a class="cta-button" href="#" onclick="return false;">
          <div class="cta-button-shine"></div>
          <span>ACTIVATE FUTURE</span>
          <img 
            src="https://api.iconify.design/solar/lightning-bold-duotone.svg?color=%23ffffff&width=32" 
            class="cta-icon" 
            alt="" 
          />
        </a>
      </div>
    </div>

  </div>

  <!-- LOAD THE LOCAL STABLE GSAP RUNTIME -->
  <script src="./vendor/gsap.min.js"></script>

  <script>
    // Ensure timelines object is setup
    window.__timelines = window.__timelines || {};

    // Dynamic Text Splitting Utility for Character Staggers
    // Replaces raw text with separate span elements with appropriate displays
    function initDynamicTextSplitting() {
      // 1. Process characters
      document.querySelectorAll('.split-chars').forEach(elem => {
        const raw = elem.textContent.trim();
        elem.textContent = '';
        const chars = raw.split('');
        chars.forEach(char => {
          const span = document.createElement('span');
          span.innerHTML = char === ' ' ? '&nbsp;' : char;
          span.style.display = 'inline-block';
          span.style.willChange = 'transform, opacity, filter';
          elem.appendChild(span);
        });
      });

      // 2. Process words
      document.querySelectorAll('.split-words').forEach(elem => {
        const raw = elem.textContent.trim();
        elem.textContent = '';
        const words = raw.split(' ');
        words.forEach((word, idx) => {
          const span = document.createElement('span');
          span.innerHTML = word;
          span.style.display = 'inline-block';
          span.style.willChange = 'transform, opacity, filter';
          
          // Add spacing if not the last word
          if (idx < words.length - 1) {
            span.style.marginRight = '16px';
          }
          elem.appendChild(span);
        });
      });
    }

    // Call dynamic splitter synchronously before registering animations
    initDynamicTextSplitting();

    // Setup main seek timeline registered on window.__timelines.Main
    const mainTl = gsap.timeline({ paused: true });

    // ==========================================
    // 0. GLOBAL CONTINUOUS AMBIENT ANIMS (0s - 14s)
    // ==========================================
    
    // Very slow drift on background glowing radial spheres
    mainTl.fromTo(".orb-violet", 
      { x: -50, y: -50 }, 
      { x: 50, y: 50, duration: 14.0, ease: "sine.inOut" }, 
      0
    );
    mainTl.fromTo(".orb-magenta", 
      { x: 80, y: 100, scale: 0.9 }, 
      { x: -80, y: -100, scale: 1.1, duration: 14.0, ease: "sine.inOut" }, 
      0
    );
    mainTl.fromTo(".orb-cyan", 
      { x: -60, y: 40, scale: 1.15 }, 
      { x: 60, y: -40, scale: 0.95, duration: 14.0, ease: "sine.inOut" }, 
      0
    );
    mainTl.fromTo(".orb-blue", 
      { x: 40, y: -60 }, 
      { x: -40, y: 60, duration: 14.0, ease: "sine.inOut" }, 
      0
    );

    // Dynamic zoom on the gorgeous background image overlay
    mainTl.fromTo(".quantum-bg-image", 
      { scale: 1.0, rotation: 0, opacity: 0.15 }, 
      { scale: 1.18, rotation: 1.5, opacity: 0.28, duration: 14.0, ease: "power1.inOut" }, 
      0
    );


    // ==========================================
    // 1. SCENE 1 CHOREOGRAPHY (0.0s - 4.0s)
    // ==========================================
    
    // Initialize Scene 1 items
    mainTl.set(".scene-1", { display: "flex", opacity: 1 }, 0);
    mainTl.set(".scene-2", { display: "none", opacity: 0 }, 0);
    mainTl.set(".scene-3", { display: "none", opacity: 0 }, 0);

    // Initial big bang spark core scale zoom
    mainTl.fromTo(".spark-core", 
      { scale: 0, opacity: 0 }, 
      { scale: 1.2, opacity: 1, duration: 0.8, ease: "back.out(2.5)" }, 
      0.1
    );

    // Expand concentric ring shockwaves
    mainTl.fromTo(".spark-ring", 
      { scale: 0.1, opacity: 0 }, 
      { scale: 3.5, opacity: 0.75, duration: 1.1, ease: "power3.out" }, 
      0.3
    );
    mainTl.to(".spark-ring", { opacity: 0, scale: 4.8, duration: 0.6, ease: "power1.in" }, 1.0);

    mainTl.fromTo(".spark-ring-outer", 
      { scale: 0.1, opacity: 0 }, 
      { scale: 2.8, opacity: 0.9, duration: 1.3, ease: "power2.out" }, 
      0.5
    );
    mainTl.to(".spark-ring-outer", { opacity: 0, scale: 3.6, duration: 0.5, ease: "sine.in" }, 1.4);

    // Subtle breathing pulse of spark core during scene 1 hold
    mainTl.fromTo(".spark-core", 
      { scale: 1.2 }, 
      { scale: 1.4, duration: 1.0, yoyo: true, repeat: 2, ease: "sine.inOut" }, 
      0.9
    );

    // Character stagger reveal on "An Idea Sparks" (Apple-style soft-blur-in)
    const s1Chars = document.querySelectorAll(".scene-1 h1.main-title span");
    mainTl.fromTo(s1Chars, 
      { y: 50, opacity: 0, scale: 0.85, filter: "blur(12px)" }, 
      { y: 0, opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.9, ease: "power3.out", stagger: 0.05 }, 
      0.6
    );

    // Subtitle entrance
    mainTl.fromTo(".scene-1 p.subtitle", 
      { y: 35, opacity: 0 }, 
      { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 
      1.3
    );

    // Transition Exit for Scene 1 (3.6s to 4.2s)
    mainTl.to(".scene-1 .text-block", { y: -80, opacity: 0, filter: "blur(10px)", duration: 0.5, ease: "power2.in" }, 3.5);
    mainTl.to(".spark-container", { scale: 0.3, opacity: 0, filter: "blur(8px)", duration: 0.6, ease: "power2.in" }, 3.5);
    mainTl.to(".scene-1", { opacity: 0, duration: 0.4 }, 3.8);
    mainTl.set(".scene-1", { display: "none" }, 4.2);


    // ==========================================
    // 2. SCENE 2 CHOREOGRAPHY (3.8s - 8.4s)
    // ==========================================
    
    // Set active visibility on overlap
    mainTl.set(".scene-2", { display: "flex", opacity: 0 }, 3.7);
    mainTl.to(".scene-2", { opacity: 1, duration: 0.4 }, 3.8);

    // Draw background neon flow path waves
    mainTl.fromTo(".wave-path", 
      { strokeDashoffset: 1200 }, 
      { strokeDashoffset: 0, duration: 1.6, ease: "power2.out", stagger: 0.25 }, 
      3.8
    );

    // Word stagger reveal on "The Pulse Accelerates"
    const s2Words = document.querySelectorAll(".scene-2 h2.main-title span");
    mainTl.fromTo(s2Words, 
      { y: 40, opacity: 0, filter: "blur(8px)" }, 
      { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.8, ease: "power4.out", stagger: 0.1 }, 
      4.1
    );

    // Subtitle reveal
    mainTl.fromTo(".scene-2 p.subtitle", 
      { opacity: 0, scale: 0.95, letterSpacing: "0.25em" }, 
      { opacity: 1, scale: 1, letterSpacing: "0.1em", duration: 1.0, ease: "power2.out" }, 
      4.6
    );

    // Glass dashboard widget slide-in from bottom with overshoot
    mainTl.fromTo(".glass-card", 
      { y: 280, rotation: 4, opacity: 0, scale: 0.9 }, 
      { y: 0, rotation: 0, opacity: 1, scale: 1, duration: 1.2, ease: "back.out(1.15)" }, 
      4.8
    );

    // Mini chart live draw path
    mainTl.fromTo(".chart-line-path", 
      { strokeDashoffset: 400 }, 
      { strokeDashoffset: 0, duration: 1.8, ease: "power2.inOut" }, 
      5.6
    );

    // Digital rolling counter value mockup (snapping numeric rollup)
    const counterObj = { val: 0.00 };
    mainTl.to(counterObj, {
      val: 248.92,
      duration: 2.3,
      ease: "power3.out",
      onUpdate: () => {
        document.getElementById("counter-value").textContent = counterObj.val.toFixed(2);
      }
    }, 5.5);

    // Subtle heartbeat scale pulse of card itself to mimic energy spikes
    mainTl.to(".glass-card", { scale: 1.02, duration: 0.15, ease: "power1.out" }, 6.2);
    mainTl.to(".glass-card", { scale: 1.0, duration: 0.35, ease: "power2.out" }, 6.35);
    mainTl.to(".glass-card", { scale: 1.03, duration: 0.15, ease: "power1.out" }, 7.0);
    mainTl.to(".glass-card", { scale: 1.0, duration: 0.35, ease: "power2.out" }, 7.15);

    // Transition Exit for Scene 2 (7.8s to 8.4s)
    mainTl.to(".scene-2 .text-block", { y: -60, opacity: 0, filter: "blur(8px)", duration: 0.5, ease: "power2.in" }, 7.8);
    mainTl.to(".glass-card", { y: -120, opacity: 0, scale: 0.92, duration: 0.55, ease: "power2.in" }, 7.8);
    mainTl.to(".wave-path", { strokeDashoffset: -1200, opacity: 0, duration: 0.6, ease: "power2.in" }, 7.8);
    mainTl.to(".scene-2", { opacity: 0, duration: 0.4 }, 8.0);
    mainTl.set(".scene-2", { display: "none" }, 8.4);


    // ==========================================
    // 3. SCENE 3 CHOREOGRAPHY (8.2s - 14.0s)
    // ==========================================

    // Set active visibility on overlap
    mainTl.set(".scene-3", { display: "flex", opacity: 0 }, 8.1);
    mainTl.to(".scene-3", { opacity: 1, duration: 0.4 }, 8.2);

    // Logo mesh & container entrance: slide up and spin in
    mainTl.fromTo(".logo-container", 
      { y: 150, scale: 0.6, opacity: 0, rotationY: 180 }, 
      { y: 0, scale: 1, opacity: 1, rotationY: 0, duration: 1.4, ease: "power4.out" }, 
      8.2
    );

    // Draw the SVG rings of logo mark
    mainTl.to(".ring-cyan", { strokeDashoffset: 0, duration: 1.5, ease: "power2.out" }, 8.5);
    mainTl.to(".ring-magenta", { strokeDashoffset: 0, duration: 1.2, ease: "power2.inOut" }, 8.7);
    mainTl.fromTo(".logo-core", 
      { scale: 0, opacity: 0 }, 
      { scale: 1, opacity: 1, duration: 0.8, ease: "elastic.out(1.2, 0.4)" }, 
      9.1
    );

    // Finite deterministic rotation of logo rings for ambient life (8.5s to 14.0s)
    mainTl.to(".logo-mesh", { rotation: 360, duration: 5.5, ease: "none" }, 8.5);
    mainTl.to(".ring-cyan", { rotation: 120, duration: 5.5, ease: "power1.out" }, 8.5);
    mainTl.to(".ring-magenta", { rotation: -180, duration: 5.5, ease: "power1.inOut" }, 8.5);

    // Tagline top fade-in
    mainTl.fromTo(".scene-3 .tagline-top", 
      { opacity: 0, y: 15, letterSpacing: "0.4em" }, 
      { opacity: 1, y: 0, letterSpacing: "0.25em", duration: 0.8, ease: "power2.out" }, 
      8.9
    );

    // Title split-character soft-blur-in reveal
    const s3Chars = document.querySelectorAll(".scene-3 h1.final-title span");
    mainTl.fromTo(s3Chars, 
      { y: 40, opacity: 0, scale: 1.15, filter: "blur(10px)" }, 
      { y: 0, opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.8, ease: "power3.out", stagger: 0.04 }, 
      9.2
    );

    // Subtitle line reveal
    mainTl.fromTo(".scene-3 h3.final-subtitle", 
      { y: 20, opacity: 0 }, 
      { y: 0, opacity: 1, duration: 0.8, ease: "power2.out" }, 
      9.8
    );

    // CTA Button entrance with spring rebound settle
    mainTl.fromTo(".cta-button-container", 
      { y: 120, scale: 0.75, opacity: 0 }, 
      { y: 0, scale: 1, opacity: 1, duration: 1.1, ease: "elastic.out(1, 0.6)" }, 
      10.2
    );

    // Dynamic glint shine across CTA button
    mainTl.fromTo(".cta-button-shine", 
      { left: "-100%" }, 
      { left: "200%", duration: 1.2, ease: "power2.inOut" }, 
      11.3
    );

    // Subtle slow float pulse on CTA Button to keep it alive
    mainTl.to(".cta-button", { y: -10, duration: 1.1, yoyo: true, repeat: 2, ease: "sine.inOut" }, 11.0);


    // ==========================================
    // REGISTER FINAL COMPILED TIMELINE
    // ==========================================
    window.__timelines.Main = mainTl;
  </script>
</body>
</html>
